services:
  mongo:
    image: mongo:7
    container_name: sushi-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sushi-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: sushi
      # Configure in .env (copy .env.example) — never commit real values.
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (copy .env.example)}
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env (copy .env.example)}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (copy .env.example)}
      # Uncomment once you have a payment processor account (see StripeProvider),
      # and set STRIPE_SECRET_KEY in .env:
      # Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY}
    ports:
      - "5000:8080" # direct API access + Swagger at http://localhost:5000/swagger
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sushi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
